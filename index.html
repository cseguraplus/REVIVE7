    <!-- Indexación por dominio: la app (apprevive7) NO debe indexarse; las landings sí. -->
    <script>
      (function () {
        try {
          var host = (location.hostname || '').toLowerCase();
          var robots = document.querySelector('meta[name="robots"]');
          if (host.indexOf('apprevive7') !== -1) {
            if (robots) robots.setAttribute('content', 'noindex, nofollow, noarchive');
            else { var m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex, nofollow, noarchive'; document.head.appendChild(m); }
            var can = document.querySelector('link[rel="canonical"]'); if (can) can.setAttribute('href', 'https://apprevive7.mx' + location.pathname);
            var og = document.querySelector('meta[property="og:url"]'); if (og) og.setAttribute('content', 'https://apprevive7.mx' + location.pathname);
          } else if (host.indexOf('aliadaservivo') !== -1) {
            var base = 'https://aliadaservivo.com' + location.pathname;
            var can = document.querySelector('link[rel="canonical"]'); if (can) can.setAttribute('href', base);
            var og = document.querySelector('meta[property="og:url"]'); if (og) og.setAttribute('content', base);
          }
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>
